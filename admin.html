<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Wheels Nepal Enduro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#0f100b; --olive-dark:#20221a; --olive-dark2:#282b1e;
  --mustard:#b7a65a; --mustard-bright:#cdbd76; --cream:#f2efe2; --cream-dim:#d9d4bf;
  --rust:#9a4f2b; --rust-bright:#c2683b; --dust:#8c8968; --line:rgba(242,239,226,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--charcoal);color:var(--cream);font-family:'Barlow Semi Condensed',sans-serif;font-size:15.5px;}
h1,h2{font-family:'Anton';font-weight:400;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px;}

/* gate screen */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
#gate input{
  background:var(--olive-dark2);border:1px solid var(--line);color:var(--cream);
  padding:14px 16px;font-size:16px;width:280px;text-align:center;font-family:'JetBrains Mono';
}
#gate button{
  background:var(--rust-bright);color:var(--cream);border:none;padding:14px 30px;
  font-family:'JetBrains Mono';font-size:13px;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;
}
#gate button:hover{background:var(--rust);}
#gate .err{color:var(--rust-bright);font-family:'JetBrains Mono';font-size:12.5px;min-height:16px;}

/* dashboard */
#dash{display:none;}
header.top{border-bottom:1px solid var(--line);padding:22px 0;display:flex;justify-content:space-between;align-items:center;}
header.top h1{font-size:22px;}
header.top span{color:var(--dust);font-size:13px;font-family:'JetBrains Mono';}
.tabs{display:flex;gap:4px;margin:28px 0 22px;border-bottom:1px solid var(--line);}
.tab{
  padding:12px 20px;cursor:pointer;font-family:'JetBrains Mono';font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--dust);border-bottom:2px solid transparent;
}
.tab.active{color:var(--mustard-bright);border-bottom-color:var(--mustard-bright);}
.panel{display:none;padding-bottom:60px;}
.panel.active{display:block;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--dust);font-family:'JetBrains Mono';font-size:11px;text-transform:uppercase;letter-spacing:0.06em;}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--cream-dim);}
td.sn{font-family:'JetBrains Mono';color:var(--mustard-bright);}
tr:hover td{background:rgba(183,166,90,0.04);}
.pill{display:inline-block;padding:3px 10px;font-family:'JetBrains Mono';font-size:10.5px;text-transform:uppercase;border:1px solid var(--line);}
.pill.pending{color:var(--mustard-bright);border-color:var(--mustard-bright);}
.pill.approved{color:#8fbf7a;border-color:#8fbf7a;}
.pill.rejected{color:var(--rust-bright);border-color:var(--rust-bright);}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;}
.row-actions button{
  background:none;border:1px solid var(--line);color:var(--cream-dim);padding:5px 10px;
  font-family:'JetBrains Mono';font-size:10.5px;cursor:pointer;text-transform:uppercase;
}
.row-actions button:hover{border-color:var(--mustard);color:var(--mustard-bright);}
.row-actions button.danger:hover{border-color:var(--rust-bright);color:var(--rust-bright);}
.thumb{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);}
a.link{color:var(--mustard-bright);text-decoration:underline;}
.empty{color:var(--dust);padding:30px 0;text-align:center;font-family:'JetBrains Mono';font-size:13px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:30px;}
.stat-cell{background:var(--charcoal);padding:20px 22px;}
.stat-cell b{display:block;font-family:'Anton';font-size:28px;color:var(--mustard-bright);}
.stat-cell span{font-size:12px;color:var(--dust);text-transform:uppercase;}
.settings-box{max-width:520px;}
.settings-box label{display:block;font-family:'JetBrains Mono';font-size:11px;color:var(--dust);text-transform:uppercase;margin-bottom:8px;}
.settings-box input[type=file], .settings-box input[type=text]{
  width:100%;background:var(--olive-dark2);border:1px solid var(--line);color:var(--cream);padding:10px 12px;margin-bottom:18px;font-family:'Barlow Semi Condensed';font-size:15px;
}
.settings-box button{background:var(--rust-bright);color:var(--cream);border:none;padding:12px 24px;font-family:'JetBrains Mono';font-size:12.5px;text-transform:uppercase;cursor:pointer;}
.settings-box img{max-width:160px;border:1px solid var(--line);margin-top:10px;}
.refresh{background:none;border:1px solid var(--line);color:var(--cream-dim);padding:8px 16px;font-family:'JetBrains Mono';font-size:11.5px;cursor:pointer;text-transform:uppercase;}
.refresh:hover{border-color:var(--mustard);color:var(--mustard-bright);}
</style>
</head>
<body>

<div id="gate">
  <h1 style="font-size:28px;">Admin Access</h1>
  <input type="password" id="gatePassword" placeholder="Enter admin password" autocomplete="off">
  <button id="gateSubmit">Enter</button>
  <div class="err" id="gateErr"></div>
</div>

<div id="dash">
  <div class="wrap">
    <header class="top">
      <h1>Wheels Nepal Enduro — Admin</h1>
      <span class="mono" id="clock"></span>
    </header>

    <div class="stat-row" id="statRow"></div>

    <div class="tabs">
      <div class="tab active" data-tab="registrations">Registrations</div>
      <div class="tab" data-tab="stalls">Stall / Sponsor Inquiries</div>
      <div class="tab" data-tab="contacts">Contact Messages</div>
      <div class="tab" data-tab="settings">Settings</div>
    </div>

    <div class="panel active" id="panel-registrations">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;"><button class="refresh" onclick="loadRegistrations()">Refresh</button></div>
      <table>
        <thead><tr><th>SN</th><th>Rider</th><th>Contact</th><th>Age / Cat</th><th>Photo</th><th>Payment</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="regBody"></tbody>
      </table>
      <div class="empty" id="regEmpty" style="display:none;">No registrations yet.</div>
    </div>

    <div class="panel" id="panel-stalls">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;"><button class="refresh" onclick="loadStalls()">Refresh</button></div>
      <table>
        <thead><tr><th>Business</th><th>Contact</th><th>Type</th><th>Message</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="stallBody"></tbody>
      </table>
      <div class="empty" id="stallEmpty" style="display:none;">No stall or sponsor inquiries yet.</div>
    </div>

    <div class="panel" id="panel-contacts">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;"><button class="refresh" onclick="loadContacts()">Refresh</button></div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Received</th><th></th></tr></thead>
        <tbody id="contactBody"></tbody>
      </table>
      <div class="empty" id="contactEmpty" style="display:none;">No messages yet.</div>
    </div>

    <div class="panel" id="panel-settings">
      <div class="settings-box">
        <label>Payment QR code image</label>
        <input type="file" id="qrUpload" accept="image/*">
        <button onclick="uploadQr()">Save QR Code</button>
        <div id="qrPreviewWrap"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ltklnslbwtzwtfpndyhc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KU82ZRBLPFIc26TqBjz8og_0CSPUHVb";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_KEY = "t6U_G6LscgjY2u4ftXEvVYQh";

// --- gate: require secret key in URL AND password ---
function checkUrlKey(){
  const params = new URLSearchParams(window.location.search);
  return params.get('key') === ADMIN_KEY;
}

document.getElementById('gateSubmit').addEventListener('click', submitGate);
document.getElementById('gatePassword').addEventListener('keydown', (e) => { if(e.key === 'Enter') submitGate(); });

async function submitGate(){
  const err = document.getElementById('gateErr');
  if (!checkUrlKey()){
    err.textContent = 'Invalid or missing access link.';
    return;
  }
  const pw = document.getElementById('gatePassword').value;
  const { data, error } = await sb.from('event_settings').select('value').eq('key','admin_password').single();
  if (error || !data || data.value !== pw){
    err.textContent = 'Incorrect password.';
    return;
  }
  sessionStorage.setItem('wne_admin_ok','1');
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  initDashboard();
}

// auto-unlock within session if already verified
if (checkUrlKey() && sessionStorage.getItem('wne_admin_ok') === '1'){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  initDashboard();
} else if (!checkUrlKey()){
  document.getElementById('gate').innerHTML = '<h1 style="font-size:22px;">Not found</h1>';
}

function initDashboard(){
  tickClock();
  setInterval(tickClock, 1000);
  loadStats();
  loadRegistrations();
  loadStalls();
  loadContacts();
  loadQrPreview();
}

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString();
}

// --- tabs ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

async function loadStats(){
  const [{ count: regCount }, { count: pendingCount }, { count: stallCount }, { count: msgCount }] = await Promise.all([
    sb.from('registrations').select('*', { count:'exact', head:true }),
    sb.from('registrations').select('*', { count:'exact', head:true }).eq('status','pending'),
    sb.from('stall_bookings').select('*', { count:'exact', head:true }),
    sb.from('contact_messages').select('*', { count:'exact', head:true }),
  ]);
  document.getElementById('statRow').innerHTML = `
    <div class="stat-cell"><b>${regCount ?? 0}</b><span>Total registrations</span></div>
    <div class="stat-cell"><b>${pendingCount ?? 0}</b><span>Pending approval</span></div>
    <div class="stat-cell"><b>${stallCount ?? 0}</b><span>Stall / sponsor inquiries</span></div>
    <div class="stat-cell"><b>${msgCount ?? 0}</b><span>Contact messages</span></div>
  `;
}

async function loadRegistrations(){
  const { data, error } = await sb.from('registrations').select('*').order('sn', { ascending:true });
  const body = document.getElementById('regBody');
  const empty = document.getElementById('regEmpty');
  body.innerHTML = '';
  if (error || !data || data.length === 0){ empty.style.display='block'; return; }
  empty.style.display = 'none';
  data.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="sn">#${String(r.sn).padStart(3,'0')}</td>
      <td>${escapeHtml(r.full_name)}</td>
      <td>${escapeHtml(r.email)}<br><span class="mono" style="font-size:12px;color:var(--dust);">${escapeHtml(r.phone)}</span></td>
      <td>${r.age} · ${escapeHtml(r.category)}</td>
      <td>${r.photo_url ? `<a href="${r.photo_url}" target="_blank"><img class="thumb" src="${r.photo_url}"></a>` : '—'}</td>
      <td>${r.payment_screenshot_url ? `<a class="link" href="${r.payment_screenshot_url}" target="_blank">View</a>` : '—'}</td>
      <td><span class="pill ${r.status}">${r.status}</span></td>
      <td><div class="row-actions">
        <button onclick="updateRegStatus('${r.id}','approved')">Approve</button>
        <button onclick="updateRegStatus('${r.id}','rejected')">Reject</button>
        <button class="danger" onclick="deleteRow('registrations','${r.id}', loadRegistrations)">Delete</button>
      </div></td>
    `;
    body.appendChild(tr);
  });
}

async function updateRegStatus(id, status){
  await sb.from('registrations').update({ status }).eq('id', id);
  loadRegistrations();
  loadStats();
}

async function loadStalls(){
  const { data, error } = await sb.from('stall_bookings').select('*').order('created_at', { ascending:false });
  const body = document.getElementById('stallBody');
  const empty = document.getElementById('stallEmpty');
  body.innerHTML = '';
  if (error || !data || data.length === 0){ empty.style.display='block'; return; }
  empty.style.display = 'none';
  data.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(s.business_name)}</td>
      <td>${escapeHtml(s.contact_name)}<br><span style="font-size:12px;color:var(--dust);">${escapeHtml(s.email)} · ${escapeHtml(s.phone)}</span></td>
      <td>${escapeHtml(s.stall_type)}</td>
      <td style="max-width:280px;">${escapeHtml(s.message || '—')}</td>
      <td><span class="pill pending">${escapeHtml(s.status)}</span></td>
      <td><div class="row-actions">
        <button onclick="updateStallStatus('${s.id}','confirmed')">Confirm</button>
        <button class="danger" onclick="deleteRow('stall_bookings','${s.id}', loadStalls)">Delete</button>
      </div></td>
    `;
    body.appendChild(tr);
  });
}

async function updateStallStatus(id, status){
  await sb.from('stall_bookings').update({ status }).eq('id', id);
  loadStalls();
}

async function loadContacts(){
  const { data, error } = await sb.from('contact_messages').select('*').order('created_at', { ascending:false });
  const body = document.getElementById('contactBody');
  const empty = document.getElementById('contactEmpty');
  body.innerHTML = '';
  if (error || !data || data.length === 0){ empty.style.display='block'; return; }
  empty.style.display = 'none';
  data.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td style="max-width:340px;">${escapeHtml(c.message)}</td>
      <td class="mono" style="font-size:12px;">${new Date(c.created_at).toLocaleDateString()}</td>
      <td><button class="row-actions" style="background:none;border:1px solid var(--line);color:var(--cream-dim);padding:5px 10px;font-family:'JetBrains Mono';font-size:10.5px;cursor:pointer;" onclick="deleteRow('contact_messages','${c.id}', loadContacts)">Delete</button></td>
    `;
    body.appendChild(tr);
  });
}

async function deleteRow(table, id, reload){
  if (!confirm('Delete this entry? This cannot be undone.')) return;
  await sb.from(table).delete().eq('id', id);
  reload();
  loadStats();
}

async function loadQrPreview(){
  const { data } = await sb.from('event_settings').select('value').eq('key','qr_code_url').single();
  const wrap = document.getElementById('qrPreviewWrap');
  wrap.innerHTML = (data && data.value) ? `<img src="${data.value}">` : '<p style="color:var(--dust);font-size:13px;margin-top:8px;">No QR code uploaded yet.</p>';
}

async function uploadQr(){
  const file = document.getElementById('qrUpload').files[0];
  if (!file) return;
  const path = `qr-${Date.now()}.${file.name.split('.').pop()}`;
  const { error } = await sb.storage.from('gallery-media').upload(path, file);
  if (error){ alert('Upload failed'); return; }
  const { data } = sb.storage.from('gallery-media').getPublicUrl(path);
  await sb.from('event_settings').upsert({ key:'qr_code_url', value:data.publicUrl });
  loadQrPreview();
}

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>
</body>
</html>
